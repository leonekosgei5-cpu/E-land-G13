    <script>
      function proceedToLoginForm(doctype) {
        document.getElementById("login-step1-doctype").style.display = "none";
        document.getElementById("login-step2-form").style.display = "block";
        // Set the selected document type in the hidden radio buttons
        document.querySelector(
          'input[name="doctype"][value="' + doctype + '"]',
        ).checked = true;
      }
